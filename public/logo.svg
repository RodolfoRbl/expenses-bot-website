<svg width="600" height="600" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#74d4ff; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0082cb; stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Main gradient background -->
  <circle cx="50" cy="50" r="50" fill="url(#grad)"/>

  <!-- Larger hollow white ring -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#ffffff" stroke-width="9"/>

  <!-- Bolder U, slightly moved up -->
  <text x="50%" y="56%" text-anchor="middle" font-size="45" font-family="Arial Black, Arial, sans-serif" fill="#ffffff" font-weight="bold" dominant-baseline="middle">U</text>
</svg>
